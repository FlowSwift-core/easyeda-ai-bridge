<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Bridge 控制台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; background: #1e1e1e; }
        #log-container { 
            max-height: 300px; 
            overflow-y: auto;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
        }
        .log-entry { padding: 4px 8px; border-bottom: 1px solid #333; }
        .log-entry.sent { color: #4ec9b0; }
        .log-entry.received { color: #ce9178; }
        .log-entry.info { color: #dcdcaa; }
        .log-entry.error { color: #f14c4c; }
        .log-entry.success { color: #6a9955; }
        .log-time { color: #858585; margin-right: 8px; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e1e1e; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
    </style>
</head>
<body class="text-gray-300">
    <div class="flex flex-col h-screen">
        <!-- Header -->
        <div class="flex items-center justify-between p-3 bg-gray-800 border-b border-gray-700">
            <div class="flex items-center gap-3">
                <h1 class="text-sm font-semibold text-white">AI Bridge</h1>
                <span id="status-badge" class="px-2 py-0.5 text-xs rounded bg-gray-600">未连接</span>
            </div>
            <div class="flex gap-2">
                <button id="btn-connect" onclick="toggleConnection()" 
                    class="px-3 py-1 text-xs rounded bg-blue-600 hover:bg-blue-700 text-white transition">
                    连接
                </button>
                <button id="btn-clear" onclick="clearLogs()" 
                    class="px-3 py-1 text-xs rounded bg-gray-600 hover:bg-gray-700 text-white transition">
                    清空日志
                </button>
            </div>
        </div>

        <!-- Status Info -->
        <div class="px-3 py-2 bg-gray-800/50 text-xs flex gap-4">
            <span>服务器: <span id="server-url" class="text-blue-400">ws://localhost:49620/eda</span></span>
            <span>连接数: <span id="connection-count" class="text-yellow-400">0</span></span>
        </div>

        <!-- Log Container -->
        <div id="log-container" class="flex-1 overflow-y-auto bg-[#1e1e1e]">
            <div id="logs"></div>
        </div>

        <!-- Input Area -->
        <div class="p-3 bg-gray-800 border-t border-gray-700">
            <div class="flex gap-2">
                <input id="msg-input" type="text" placeholder="输入消息..." 
                    class="flex-1 px-3 py-2 bg-gray-700 border border-gray-600 rounded text-sm text-white placeholder-gray-500 focus:outline-none focus:border-blue-500"
                    onkeypress="if(event.key==='Enter')sendMessage()">
                <button onclick="sendMessage()" 
                    class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded text-white text-sm transition">
                    发送
                </button>
            </div>
        </div>
    </div>

    <script>
        const WS_ID = 'ai-bridge-ws';
        const WS_URL = 'ws://localhost:49620/eda';
        
        let ws = null;
        let logs = [];
        const MAX_LOGS = 100;

        function log(type, message, direction = 'info') {
            const time = new Date().toLocaleTimeString();
            logs.push({ time, type, message, direction });
            if (logs.length > MAX_LOGS) logs.shift();
            renderLogs();
        }

        function renderLogs() {
            const container = document.getElementById('logs');
            container.innerHTML = logs.map(l => `
                <div class="log-entry ${l.direction}">
                    <span class="log-time">[${l.time}]</span>
                    <span class="${l.type === 'error' ? 'text-red-400' : ''}">${escapeHtml(l.message)}</span>
                </div>
            `).join('');
            document.getElementById('log-container').scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearLogs() {
            logs = [];
            renderLogs();
            log('info', '日志已清空');
        }

        function updateStatus(connected) {
            const badge = document.getElementById('status-badge');
            const btn = document.getElementById('btn-connect');
            if (connected) {
                badge.textContent = '已连接';
                badge.className = 'px-2 py-0.5 text-xs rounded bg-green-600 text-white';
                btn.textContent = '断开';
                btn.className = 'px-3 py-1 text-xs rounded bg-red-600 hover:bg-red-700 text-white transition';
            } else {
                badge.textContent = '未连接';
                badge.className = 'px-2 py-0.5 text-xs rounded bg-gray-600 text-gray-300';
                btn.textContent = '连接';
                btn.className = 'px-3 py-1 text-xs rounded bg-blue-600 hover:bg-blue-700 text-white transition';
            }
        }

        async function toggleConnection() {
            if (ws) {
                try {
                    eda.sys_WebSocket.close(WS_ID);
                    ws = null;
                    updateStatus(false);
                    log('info', '已断开连接', 'error');
                } catch (e) {
                    log('error', '断开失败: ' + e.message);
                }
            } else {
                try {
                    eda.sys_WebSocket.register(
                        WS_ID,
                        WS_URL,
                        (event) => {
                            try {
                                const data = JSON.parse(event.data);
                                log('received', JSON.stringify(data), 'received');
                            } catch {
                                log('received', event.data, 'received');
                            }
                        },
                        () => {
                            ws = { send: (data) => eda.sys_WebSocket.send(WS_ID, data) };
                            updateStatus(true);
                            log('success', '连接成功!', 'success');
                            document.getElementById('connection-count').textContent = '1';
                        }
                    );
                } catch (e) {
                    log('error', '连接失败: ' + e.message);
                    alert('连接失败: ' + e.message + '\n\n请确保已启用扩展的"外部交互权限"');
                }
            }
        }

        function sendMessage() {
            const input = document.getElementById('msg-input');
            const msg = input.value.trim();
            if (!msg) return;
            
            if (!ws) {
                log('error', '请先连接 WebSocket');
                return;
            }

            try {
                ws.send(msg);
                log('sent', msg, 'sent');
                input.value = '';
            } catch (e) {
                log('error', '发送失败: ' + e.message);
            }
        }

        // Auto-connect on load
        window.addEventListener('load', () => {
            log('info', '正在连接...');
            toggleConnection();
        });
    </script>
</body>
</html>
