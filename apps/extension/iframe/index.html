<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyEDA AI Bridge</title>
    <link rel="stylesheet" href="/dist/styles.css">
</head>
<body>
    <div id="root"></div>
    <script src="/dist/iframe.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', function() {
            if (window.eda) {
                window.initReactApp({
                    eda: window.eda,
                    onRequestPairing: function() {
                        return window.eda.sys_MessageBus.rpcCallPublic('ai-bridge-status', 'requestPairing');
                    },
                    onDisconnect: function() {
                        return window.eda.sys_MessageBus.rpcCallPublic('ai-bridge-status', 'disconnect');
                    }
                });
            }
        });
        window.addEventListener('load', function() {
            setTimeout(function() {
                if (window.eda && window.initReactApp) {
                    window.initReactApp({
                        eda: window.eda,
                        onRequestPairing: function() {
                            return window.eda.sys_MessageBus.rpcCallPublic('ai-bridge-status', 'requestPairing');
                        },
                        onDisconnect: function() {
                            return window.eda.sys_MessageBus.rpcCallPublic('ai-bridge-status', 'disconnect');
                        }
                    });
                }
            }, 500);
        });
    </script>
</body>
</html>
