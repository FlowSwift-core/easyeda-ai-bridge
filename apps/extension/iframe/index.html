<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Bridge</title>
    <link rel="stylesheet" href="/dist/styles.css">
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: "SF Mono", "Monaco", "Inconsolata", "Fira Code", monospace;
            font-size: 12px;
            background: rgba(13, 17, 23, 0.85);
            color: #c9d1d9;
            margin: 0;
            padding: 16px;
        }
        .status {
            font-size: 14px;
            margin-bottom: 12px;
        }
        .status.connected { color: #3fb950; }
        .status.disconnected { color: #f85149; }
        .log {
            font-size: 11px;
            color: #8b949e;
            max-height: 300px;
            overflow-y: auto;
        }
        button {
            background: #238636;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            margin-right: 8px;
        }
        button:hover { background: #2ea043; }
    </style>
</head>
<body>
    <div class="status disconnected" id="status">○ disconnected</div>
    <div style="margin-bottom: 12px;">
        <button onclick="queryStatus()">Query Status</button>
    </div>
    <div class="log" id="log"></div>

    <script>
        const log = document.getElementById('log');
        const status = document.getElementById('status');
        
        function addLog(msg) {
            const div = document.createElement('div');
            div.textContent = new Date().toLocaleTimeString() + ' ' + msg;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }

        function updateStatus(connected) {
            if (connected) {
                status.textContent = '● connected';
                status.className = 'status connected';
            } else {
                status.textContent = '○ disconnected';
                status.className = 'status disconnected';
            }
        }

        // Subscribe to events from main process
        function subscribeEvents() {
            try {
                eda.sys_MessageBus.subscribePublic('easyeda-ai-bridge-events', (msg) => {
                    if (msg.type === 'execute') {
                        addLog('→ EXECUTE: ' + msg.data.code.substring(0, 80) + (msg.data.code.length > 80 ? '...' : ''));
                    } else if (msg.type === 'result') {
                        const resultStr = JSON.stringify(msg.data.result);
                        addLog('← RESULT (' + msg.data.duration + 'ms): ' + resultStr.substring(0, 100) + (resultStr.length > 100 ? '...' : ''));
                    } else if (msg.type === 'error') {
                        addLog('✕ ERROR (' + msg.data.duration + 'ms): ' + msg.data.error);
                    }
                });
                addLog('Subscribed to events');
            } catch(e) {
                addLog('Subscribe error: ' + e.message);
            }
        }

        // Call main extension RPC service to get status
        async function queryStatus() {
            try {
                const result = await eda.sys_MessageBus.rpcCallPublic('ai-bridge-status');
                if (result) {
                    updateStatus(result.connected);
                    if (result.windowId) {
                        addLog('Window ID: ' + result.windowId);
                    }
                }
            } catch(e) {
                addLog('RPC error: ' + e.message);
            }
        }

        // Poll status every 2 seconds
        function init() {
            addLog('IFrame loaded');
            subscribeEvents();
            queryStatus();
            setInterval(queryStatus, 10000);
        }

        if (window.eda) {
            init();
        } else {
            window.onload = () => setTimeout(init, 500);
        }
    </script>
</body>
</html>
