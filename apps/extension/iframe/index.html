<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Bridge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap');
        body { 
            margin: 0; 
            padding: 0; 
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            font-family: 'JetBrains Mono', monospace;
        }
        #log-container { 
            max-height: 380px; 
            overflow-y: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            scrollbar-width: thin;
        }
        .log-entry { 
            padding: 6px 10px; 
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: background 0.15s ease;
        }
        .log-entry:hover { background: rgba(255,255,255,0.03); }
        .log-entry.sent { border-left: 3px solid #10b981; }
        .log-entry.received { border-left: 3px solid #3b82f6; }
        .log-entry.info { border-left: 3px solid #6366f1; }
        .log-entry.error { border-left: 3px solid #ef4444; }
        .log-entry.success { border-left: 3px solid #22c55e; }
        .log-time { color: #64748b; margin-right: 8px; font-size: 10px; }
        .badge-sent { background: rgba(16, 185, 129, 0.15); color: #10b981; }
        .badge-received { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
        .badge-info { background: rgba(99, 102, 241, 0.15); color: #6366f1; }
        .badge-error { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
        .badge-success { background: rgba(34, 197, 94, 0.15); color: #22c55e; }
        .glow-green { box-shadow: 0 0 20px rgba(16, 185, 129, 0.4); }
        .glow-blue { box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            transition: all 0.2s ease;
        }
        .btn-danger:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
        }
        .input-modern {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.2s ease;
        }
        .input-modern:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            outline: none;
        }
        .card {
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.08);
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
        .pulse-dot { animation: pulse-dot 2s ease-in-out infinite; }
        @keyframes slide-in {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .slide-in { animation: slide-in 0.3s ease-out; }
    </style>
</head>
<body class="text-gray-300">
    <div class="flex flex-col h-screen">
        <!-- Header -->
        <div class="p-4 bg-gray-900/80 border-b border-gray-700/50">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center">
                            <i class="fas fa-bolt text-white text-lg"></i>
                        </div>
                        <div>
                            <h1 class="text-base font-semibold text-white tracking-wide">AI Bridge</h1>
                            <p class="text-xs text-gray-400">EasyEDA WebSocket Bridge</p>
                        </div>
                    </div>
                    <div class="h-8 w-px bg-gray-700 mx-2"></div>
                    <div class="flex items-center gap-2">
                        <span id="status-dot" class="w-2 h-2 rounded-full bg-gray-500 pulse-dot"></span>
                        <span id="status-badge" class="px-3 py-1 text-xs rounded-full bg-gray-700 text-gray-300 font-medium">未连接</span>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button id="btn-connect" onclick="toggleConnection()" 
                        class="btn-primary px-4 py-2 text-xs rounded-lg text-white font-medium flex items-center gap-2">
                        <i class="fas fa-plug"></i>
                        <span>连接</span>
                    </button>
                    <button id="btn-clear" onclick="clearLogs()" 
                        class="px-4 py-2 text-xs rounded-lg bg-gray-700 hover:bg-gray-600 text-gray-300 font-medium transition flex items-center gap-2">
                        <i class="fas fa-trash-alt"></i>
                        <span>清空</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Info Cards -->
        <div class="p-3 grid grid-cols-2 gap-3">
            <div class="card rounded-xl p-3">
                <div class="flex items-center gap-2 text-xs text-gray-400 mb-1">
                    <i class="fas fa-server"></i>
                    <span>服务器地址</span>
                </div>
                <div id="server-url" class="text-sm text-blue-400 font-medium truncate">ws://localhost:49620/eda</div>
            </div>
            <div class="card rounded-xl p-3">
                <div class="flex items-center gap-2 text-xs text-gray-400 mb-1">
                    <i class="fas fa-link"></i>
                    <span>连接数</span>
                </div>
                <div class="flex items-center gap-2">
                    <span id="connection-count" class="text-2xl font-bold text-yellow-400">0</span>
                    <span class="text-xs text-gray-500">个连接</span>
                </div>
            </div>
        </div>

        <!-- Log Container -->
        <div class="flex-1 mx-3 mb-3 rounded-xl bg-gray-900/50 border border-gray-700/30 overflow-hidden">
            <div class="flex items-center justify-between px-3 py-2 bg-gray-800/50 border-b border-gray-700/30">
                <div class="flex items-center gap-2 text-xs text-gray-400">
                    <i class="fas fa-terminal"></i>
                    <span>消息日志</span>
                </div>
                <span id="log-count" class="text-xs text-gray-500">0 条消息</span>
            </div>
            <div id="log-container">
                <div id="logs" class="py-1"></div>
                <div id="empty-state" class="flex flex-col items-center justify-center py-12 text-gray-500">
                    <i class="fas fa-inbox text-4xl mb-3"></i>
                    <p class="text-sm">暂无消息</p>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-3 bg-gray-900/80 border-t border-gray-700/50">
            <div class="flex gap-2">
                <input id="msg-input" type="text" placeholder="输入 JSON 消息或纯文本..." 
                    class="input-modern flex-1 px-4 py-2.5 rounded-xl text-sm text-white placeholder-gray-500"
                    onkeypress="if(event.key==='Enter')sendMessage()">
                <button onclick="sendMessage()" 
                    class="btn-primary px-5 py-2.5 rounded-xl text-white text-sm font-medium flex items-center gap-2">
                    <i class="fas fa-paper-plane"></i>
                    <span>发送</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const WS_ID = 'ai-bridge-ws';
        const WS_URL = 'ws://localhost:49620/eda';
        
        let ws = null;
        let logs = [];
        const MAX_LOGS = 100;

        function log(type, message, direction = 'info') {
            const time = new Date().toLocaleTimeString();
            const entry = { time, type, message, direction };
            logs.push(entry);
            if (logs.length > MAX_LOGS) logs.shift();
            renderLogs();
        }

        function renderLogs() {
            const container = document.getElementById('logs');
            const emptyState = document.getElementById('empty-state');
            const logCount = document.getElementById('log-count');
            
            logCount.textContent = `${logs.length} 条消息`;
            
            if (logs.length === 0) {
                emptyState.style.display = 'flex';
                container.innerHTML = '';
                return;
            }
            
            emptyState.style.display = 'none';
            container.innerHTML = logs.map(l => `
                <div class="log-entry ${l.direction} slide-in">
                    <span class="log-time">[${l.time}]</span>
                    <span class="px-1.5 py-0.5 rounded text-[10px] font-medium badge-${l.direction} mr-2">${getTypeLabel(l.direction)}</span>
                    <span class="text-gray-300">${escapeHtml(l.message)}</span>
                </div>
            `).join('');
            
            const logContainer = document.getElementById('log-container');
            logContainer.scrollTop = container.scrollHeight;
        }

        function getTypeLabel(direction) {
            const labels = {
                'sent': '发送',
                'received': '接收',
                'info': '信息',
                'error': '错误',
                'success': '成功'
            };
            return labels[direction] || direction;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearLogs() {
            logs = [];
            renderLogs();
            log('info', '日志已清空');
        }

        function updateStatus(connected) {
            const badge = document.getElementById('status-badge');
            const btn = document.getElementById('btn-connect');
            const dot = document.getElementById('status-dot');
            
            if (connected) {
                badge.textContent = '已连接';
                badge.className = 'px-3 py-1 text-xs rounded-full bg-green-500/20 text-green-400 font-medium';
                btn.innerHTML = '<i class="fas fa-plug-circle-xmark"></i><span>断开</span>';
                btn.className = 'btn-danger px-4 py-2 text-xs rounded-lg text-white font-medium flex items-center gap-2';
                dot.className = 'w-2 h-2 rounded-full bg-green-500 pulse-dot';
                dot.style.boxShadow = '0 0 10px rgba(34, 197, 94, 0.6)';
            } else {
                badge.textContent = '未连接';
                badge.className = 'px-3 py-1 text-xs rounded-full bg-gray-700 text-gray-300 font-medium';
                btn.innerHTML = '<i class="fas fa-plug"></i><span>连接</span>';
                btn.className = 'btn-primary px-4 py-2 text-xs rounded-lg text-white font-medium flex items-center gap-2';
                dot.className = 'w-2 h-2 rounded-full bg-gray-500 pulse-dot';
                dot.style.boxShadow = 'none';
            }
        }

        async function toggleConnection() {
            if (ws) {
                try {
                    eda.sys_WebSocket.close(WS_ID);
                    ws = null;
                    updateStatus(false);
                    document.getElementById('connection-count').textContent = '0';
                    log('info', '已断开连接', 'error');
                } catch (e) {
                    log('error', '断开失败: ' + e.message);
                }
            } else {
                try {
                    eda.sys_WebSocket.register(
                        WS_ID,
                        WS_URL,
                        (event) => {
                            try {
                                const data = JSON.parse(event.data);
                                log('received', JSON.stringify(data, null, 2), 'received');
                            } catch {
                                log('received', event.data, 'received');
                            }
                        },
                        () => {
                            ws = { send: (data) => eda.sys_WebSocket.send(WS_ID, data) };
                            updateStatus(true);
                            log('success', '连接成功!', 'success');
                            document.getElementById('connection-count').textContent = '1';
                        }
                    );
                } catch (e) {
                    log('error', '连接失败: ' + e.message);
                    alert('连接失败: ' + e.message + '\n\n请确保已启用扩展的"外部交互权限"');
                }
            }
        }

        function sendMessage() {
            const input = document.getElementById('msg-input');
            const msg = input.value.trim();
            if (!msg) return;
            
            if (!ws) {
                log('error', '请先连接 WebSocket', 'error');
                return;
            }

            try {
                ws.send(msg);
                log('sent', msg, 'sent');
                input.value = '';
            } catch (e) {
                log('error', '发送失败: ' + e.message);
            }
        }

        window.addEventListener('load', () => {
            log('info', '正在连接服务器...', 'info');
            toggleConnection();
        });
    </script>
</body>
</html>
